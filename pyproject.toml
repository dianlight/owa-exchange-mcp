[project]
name = "exchange-mcp-server"
# Read from exchange_mcp.__version__ so the running code and the package
# metadata can't drift apart - see the comment in exchange_mcp/__init__.py.
dynamic = ["version"]
description = "MCP server for Exchange / OWA - email, calendar, directory, availability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "exchange", "owa", "outlook", "email", "calendar"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    # v2 of the SDK, and the floor is 2.2.0 rather than 2.0.0 for a reason:
    # `MCPServer` and `streamable_http_client` exist from 2.0.0, but
    # `run(transport="streamable-http", session_idle_timeout=...)` only landed in
    # 2.2.0 -- and server.py passes it (to switch off 2.2's new 30-minute session
    # reaper, see the comment there). On 2.0.x/2.1.x that call is a TypeError at
    # startup, so a wider floor would buy nothing but a worse error.
    #
    # The `<3` cap is the lesson of the 1.x -> 2.x jump, not caution for its own
    # sake: that major renamed `FastMCP` to `MCPServer`, and every module here
    # (server.py plus all 11 tool modules) died at *import* time against it --
    # ModuleNotFoundError, not a deprecation warning. A dev machine that had
    # installed while 1.x was current kept working and never saw it; a clean
    # `pip install -e .` (new contributor, or CI) got 2.x and nothing ran at all
    # (issue #16). With a cap, the next major resolves to a working 2.x instead;
    # lifting it means doing that migration, exactly as this one was done.
    "mcp>=2.2.0,<3",
    "playwright",
    # IANA timezone data for `zoneinfo`, which the availability tools need to
    # put UTC busy periods on the mailbox's own working-hours grid
    # (`availability_frame`). Not optional on Windows and not merely a
    # nicety elsewhere: Windows ships no IANA database at all, so a stock
    # `python -m pip install -e .` there leaves
    # `zoneinfo.available_timezones()` **empty** and every zone lookup raises
    # ZoneInfoNotFoundError (measured on Windows 11 / CPython 3.14). Slim
    # Linux containers have the same hole. Unpinned and unconditional: it is
    # pure data, it has no dependencies of its own, and a marker limiting it
    # to Windows would make the failure environment-specific instead of
    # impossible - the one shape of bug that is worst to debug from a bug
    # report. `availability_frame` still degrades to "not shifting, and
    # saying so" if it is somehow absent.
    "tzdata",
]

[project.urls]
Homepage = "https://github.com/dianlight/owa-exchange-mcp"
Repository = "https://github.com/dianlight/owa-exchange-mcp"

[project.scripts]
exchange-mcp-server = "exchange_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "exchange_mcp.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["exchange_mcp*"]
