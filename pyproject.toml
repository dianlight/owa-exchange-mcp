[project]
name = "exchange-mcp-server"
# Read from exchange_mcp.__version__ so the running code and the package
# metadata can't drift apart - see the comment in exchange_mcp/__init__.py.
dynamic = ["version"]
description = "MCP server for Exchange / OWA - email, calendar, directory, availability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "exchange", "owa", "outlook", "email", "calendar"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Pinned below 2.0 on purpose: mcp 2.x renamed FastMCP to MCPServer and
    # changed the surrounding API, so every module here (server.py plus all 11
    # tool modules, each importing `mcp.server.fastmcp`) fails to import
    # outright against it -- ModuleNotFoundError at `from mcp.server.fastmcp
    # import Context`, not a deprecation warning. A dev machine that installed
    # while 1.x was current never sees this; a fresh `pip install -e .` (a new
    # contributor, or CI) gets 2.x and nothing works. Lift the pin only together
    # with the v2 migration.
    "mcp>=1.0.0,<2",
    "playwright",
]

[project.urls]
Homepage = "https://github.com/dianlight/owa-exchange-mcp"
Repository = "https://github.com/dianlight/owa-exchange-mcp"

[project.scripts]
exchange-mcp-server = "exchange_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "exchange_mcp.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["exchange_mcp*"]
